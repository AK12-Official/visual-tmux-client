version: "2"

linters:
  default: none
  enable:
    - mnd
    - goconst
    - lll
    - funlen
    - gocyclo
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - nolintlint
  settings:
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
    goconst:
      min-len: 3
      min-occurrences: 3
      numbers: false
    lll:
      line-length: 120
      tab-width: 4
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocyclo:
      min-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - mnd
          - goconst
          - funlen
          - gocyclo
      - path: 'defaults\.go'
        linters:
          - mnd

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
