name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Build web UI
        run: npm ci && npm run build
        working-directory: hub/web
      - name: Test web UI
        run: npm test
        working-directory: hub/web
      - name: Install golangci-lint
        run: ./scripts/install-golangci-lint.sh /usr/local/bin
      - name: Verify golangci-lint config
        run: golangci-lint config verify --config ../.golangci.yml
        working-directory: hub
      - name: Lint Go packages
        run: golangci-lint run --config ../.golangci.yml ./...
        working-directory: hub
      - name: Test Go packages
        run: go test ./...
        working-directory: hub
      - name: Vet Go packages
        run: go vet ./...
        working-directory: hub
      - name: Build application
        run: go build -trimpath -o visual-tmux-client ./cmd/visual-tmux-client
        working-directory: hub
