# Visual Tmux Client Configuration Example
# All durations must be unit-bearing strings (e.g. 5s, 500ms, 1m).

version: 1

server:
  # HTTP listen address (host:port).
  # Can also be set via VISUAL_TMUX_CLIENT_ADDR environment variable.
  addr: "127.0.0.1:7690"
  read_header_timeout: "10s"
  idle_timeout: "120s"
  max_request_body_bytes: 65536 # 64 KiB

auth:
  # Bearer authentication token.
  # If left empty, an ephemeral token is generated and printed to stderr at startup.
  # Can also be set via VISUAL_TMUX_CLIENT_TOKEN environment variable.
  token: ""
  ticket_ttl: "30s"
  ticket_sweep_interval: "10s"

tmux:
  # Path to tmux executable. If left empty, resolved from system PATH.
  # Can also be set via VISUAL_TMUX_CLIENT_TMUX_PATH environment variable.
  path: ""

websocket:
  # Allowed Origin URL (e.g. "https://tmux.example.com").
  # If left empty, defaults to matching request host and port.
  # Can also be set via VISUAL_TMUX_CLIENT_ORIGIN environment variable.
  origin: ""
  max_input_message_bytes: 8388608 # 8 MiB (permits large terminal paste)
  control_write_timeout: "5s"
  output_write_timeout: "10s"
  exit_write_timeout: "3s"

terminal:
  max_dimension: 1000
  staging_buffer_bytes: 2097152 # 2 MiB
  output_high_water_bytes: 1048576 # 1 MiB
  output_low_water_bytes: 131072 # 128 KiB
  backpressure_poll_interval: "100ms"

shutdown:
  attachment_timeout: "3s"
  http_timeout: "10s"

web:
  session_poll_interval: "5s"
  activity_decay: "2s"
  activity_throttle: "500ms"
  resize_debounce: "100ms"
  reconnect:
    initial_delay: "500ms"
    max_delay: "3s"
  terminal:
    scrollback: 5000
    font_size: 13
    min_font_size: 8
    max_font_size: 24
  notifications:
    max_toasts: 5
    error_lifetime: "8s"
    warning_lifetime: "5s"
    info_lifetime: "3s"

files:
  # Whether the browser file manager and its REST API are available.
  # When false, every file operation is refused without touching the filesystem;
  # terminal and session operations are unaffected.
  enabled: true

  # Root directories the file manager is confined to.
  #
  # Omitting this key (or leaving the list empty) means NO directory containment:
  # file operations are bounded only by the access the hub process's own
  # operating-system user already has. The hub issues a bearer token that also
  # authorizes a full interactive terminal as that same user, so an operator who
  # holds the token can reach those paths through the terminal regardless.
  #
  # Setting roots replaces that default and confines every file operation to
  # them. Each root must be an absolute path to an existing directory; it is
  # resolved through symlinks at startup, and a root that does not exist, is not
  # a directory, or cannot be resolved is a startup error. `/proc`, `/sys` and
  # `/dev` are always refused, in both modes.
  #
  # roots:
  #   - "/srv/projects"
  #   - "/var/log"

  # Largest single file the API will read, write, or download, in bytes.
  max_file_size: 104857600 # 100 MiB

  # Largest number of entries one directory listing returns, after which the
  # result is reported as truncated. Hard cap: 10000.
  max_dir_entries: 1000
