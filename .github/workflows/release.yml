name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Build web UI
        run: npm ci && npm run build
        working-directory: hub/web
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="visual-tmux-client_${version}_${GOOS}_${GOARCH}"
          mkdir -p "staging/$name"
          (cd hub && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../staging/$name/visual-tmux-client" .)
          cp README.md LICENSE "staging/$name/"
          tar -C staging -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: visual-tmux-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: visual-tmux-client_*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: sha256sum artifacts/visual-tmux-client_*.tar.gz > artifacts/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Visual Tmux Client $GITHUB_REF_NAME"
