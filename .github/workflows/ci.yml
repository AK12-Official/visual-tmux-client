name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - name: Validate release version
        id: version
        run: node scripts/ci-version.mjs >> "$GITHUB_OUTPUT"
      - name: Require release commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Test release version validation
        run: node --test scripts/ci-version.test.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Build web UI
        run: npm ci && npm run build
        working-directory: hub/web
      - name: Test web UI
        run: npm test
        working-directory: hub/web
      - name: Install golangci-lint
        run: ./scripts/install-golangci-lint.sh /usr/local/bin
      - name: Verify golangci-lint config
        run: golangci-lint config verify --config ../.golangci.yml
        working-directory: hub
      - name: Lint Go packages
        run: golangci-lint run --config ../.golangci.yml ./...
        working-directory: hub
      - name: Test Go packages
        run: go test ./...
        working-directory: hub
      - name: Vet Go packages
        run: go vet ./...
        working-directory: hub
      - name: Build application
        run: go build -trimpath -o visual-tmux-client ./cmd/visual-tmux-client
        working-directory: hub
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: hub/web/dist/
          if-no-files-found: error

  package:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: hub/web/dist/
      - name: Build archive from validated source and web assets
        env:
          VERSION: ${{ needs.test.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          name="visual-tmux-client_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "staging/$name/configs"
          (cd hub && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../staging/$name/visual-tmux-client" ./cmd/visual-tmux-client)
          cp README.md README.zh-CN.md LICENSE "staging/$name/"
          cp configs/visual-tmux-client.example.yaml "staging/$name/configs/"
          tar -C staging -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: visual-tmux-client_*.tar.gz
          if-no-files-found: error

  assemble:
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Verify all archives and create checksums
        working-directory: artifacts
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="visual-tmux-client_${VERSION}_${target}.tar.gz"
            test -s "$archive"
            tar -tzf "$archive" > /dev/null
          done
          sha256sum visual-tmux-client_*.tar.gz > checksums.txt
          sha256sum --check checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [test, assemble]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: artifacts
      - name: Verify release checksums
        working-directory: artifacts
        run: sha256sum --check checksums.txt
      - name: Upload draft and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Visual Tmux Client $RELEASE_TAG" \
            --draft
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
